<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketLedger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <div class="brand">⚡ POCKET LEDGER</div>
      <button class="target-badge" onclick="setTarget()">🎯 Target: <span id="target-val">Set Target</span></button>
    </header>

    <!-- Budget Card -->
    <section class="budget-hero">
      <span class="hero-label">REMAINING FROM TARGET</span>
      <h1 id="net-balance">₹0.00</h1>
      <div class="progress-wrap">
        <div class="progress-info"><span>Target Progress</span><span id="burn-percentage">0% spent</span></div>
        <div class="progress-track"><div id="meter-fill" class="progress-bar"></div></div>
      </div>
      <div class="metrics-grid">
        <div><span>TOTAL INFLOW</span><strong id="inflow-val">+₹0.00</strong></div>
        <div class="text-right"><span>TOTAL SPENT</span><strong id="outflow-val">-₹0.00</strong></div>
      </div>
    </section>

    <!-- Form with Smart Suggestions -->
    <section class="form-card">
      <form id="tx-form">
        <div class="toggle-switch">
          <label class="toggle-opt active"><input type="radio" name="tx-type" value="expense" checked><span>- Expense</span></label>
          <label class="toggle-opt"><input type="radio" name="tx-type" value="income"><span>+ Income</span></label>
        </div>

        <div class="input-row">
          <input type="text" id="tx-title" list="title-suggestions" placeholder="Description (e.g. Lunch)" autocomplete="off" required>
          <datalist id="title-suggestions"></datalist>
          <input type="number" id="tx-amount" placeholder="Amount (₹)" min="0.01" step="any" required>
        </div>
        
        <!-- Suggestions Row -->
        <div id="suggest-box" class="suggest-box"></div>

        <div class="category-chips">
          <label><input type="radio" name="cat" value="🍔 Food" checked><span>🍔 Food</span></label>
          <label><input type="radio" name="cat" value="⚡ Bills"><span>⚡ Bills</span></label>
          <label><input type="radio" name="cat" value="💼 Work"><span>💼 Work</span></label>
          <label><input type="radio" name="cat" value="🛍️ Shop"><span>🛍️ Shop</span></label>
          <label><input type="radio" name="cat" value="📦 Misc"><span>📦 Misc</span></label>
        </div>

        <button type="submit" class="submit-action">+ Save Transaction</button>
      </form>
    </section>

    <!-- History -->
    <section class="history-card">
      <div class="history-top"><h3>Recent Activity</h3><span id="entry-count" class="count-badge">0 items</span></div>
      <ul id="activity-feed" class="activity-feed"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
